<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Comfort – All Carpets &amp; Home Furnishings</title>
    <meta name="description" content="Browse the full Maison Comfort collection of carpets and home furnishings, delivered across all 69 wilayas of Algeria." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://rgbmfstbvqzvgxadjxrb.supabase.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/images/favicon.ico" />
    <script>if(localStorage.getItem('bybens_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
    <link rel="stylesheet" href="/supplements/footer.css" />
    <script>
      window.__initialDataPromise = fetch("/api/initial-data")
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    </script>

    <link rel="stylesheet" href="/supplements/home/index.css?v=32" />
    <link rel="stylesheet" href="/supplements/products/index.css?v=1" />
    <script>if(sessionStorage.getItem('bb_wl'))document.documentElement.classList.add('bb-noanim');</script>
  </head>
  <body>
    <!-- PAGE LOADER -->
    <div id="pageLoader">
      <div class="wl-weave"><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div><div class="wl-thread"></div></div>
      <div class="wl-body">
        <div class="wl-logo-wrap">
          <img src="/images/logo-dark.png" alt="Maison Comfort" class="wl-logo" />
        </div>
        <div class="wl-line-wrap">
          <div class="wl-line-fill"></div>
          <div class="wl-shuttle"></div>
        </div>
        <div class="wl-tagline">CRAFT<span class="wl-dot">·</span>COMFORT<span class="wl-dot">·</span>HOME</div>
      </div>
    </div>
    <!-- Data loading spinner -->
    <div id="dataSpinner"><div class="ds-ring"></div></div>

    <!-- ═══ HEADER ════════════════════════════════════════════════ -->
    <header id="site-header" class="scrolled">
      <div class="container">
        <!-- Row 1: logo · page links · lang / theme / cart -->
        <nav class="top-nav" aria-label="Main navigation">
          <!-- Logo (far left) -->
          <a href="/" class="logo" aria-label="Maison Comfort Home">
            <img src="/images/logo.png" alt="Maison Comfort" class="logo-img logo-img-light" />
            <img src="/images/logo-dark.png" alt="Maison Comfort" class="logo-img logo-img-dark" />
          </a>

          <!-- Page Links (desktop only) -->
          <div class="nav-pages" aria-label="Pages">
            <a href="/" class="nav-link" data-i18n="nav.home">Home</a>
            <a href="/products" class="nav-link active" data-i18n="nav.products">Products</a>
            <a href="#footerPlaceholder" class="nav-link" onclick="scrollToFooter(event)" data-i18n="nav.contact">Contact</a>
          </div>

          <!-- Right Controls -->
          <div class="nav-right">
            <div
              class="lang-switch"
              role="group"
              aria-label="Language switcher"
            >
              <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
              <button class="lang-btn active" data-lang="fr" onclick="switchLang('fr')">FR</button>
              <button class="lang-btn" data-lang="ar" onclick="switchLang('ar')">AR</button>
            </div>

            <button class="theme-btn desktop-theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">
              <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>

            <button class="cart-btn" aria-label="Shopping cart" onclick="toggleCart()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8h12l-1.1 12.1a2 2 0 0 1-2 1.9H9.1a2 2 0 0 1-2-1.9L6 8z" />
                <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
              </svg>
              <span class="cart-badge" id="cartBadge">0</span>
            </button>

            <button
              class="hamburger"
              id="hamburgerBtn"
              aria-label="Toggle menu"
              aria-expanded="false"
              onclick="toggleMobileMenu()"
            >
              <span></span><span></span><span></span>
            </button>
          </div>
        </nav>

        <!-- Row 2: centered search bar -->
        <div class="nav-search-row">
          <div class="search-wrap" role="search" id="desktopSearch">
            <svg class="search-icon-lead" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input
              type="search"
              id="searchInput"
              data-i18n="search.placeholder"
              placeholder="Search carpets, rugs, home decor…"
              aria-label="Search products"
              autocomplete="off"
              oninput="handleSearch(this.value)"
            />
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation">
      <div class="mm-hd">
        <span class="mm-brand">Maison Comfort</span>
        <button class="mm-close" onclick="toggleMobileMenu()" aria-label="Close menu">&#x2715;</button>
      </div>
      <div class="mm-body">
        <div class="mm-section">
          <a href="/" class="m-link" onclick="toggleMobileMenu()" data-i18n="nav.home">Home</a>
          <a href="/products" class="m-link active" onclick="toggleMobileMenu()" data-i18n="nav.products">Products</a>
          <a href="#footerPlaceholder" class="m-link" onclick="toggleMobileMenu();scrollToFooter(event)" data-i18n="nav.contact">Contact</a>
        </div>
        <div class="mm-section">
          <p class="mm-section-label" data-i18n="footer.categories">Categories</p>
          <div id="mobileCatItems"></div>
        </div>
      </div>
      <div class="mobile-lang">
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        <button class="lang-btn active" data-lang="fr" onclick="switchLang('fr')">FR</button>
        <button class="lang-btn" data-lang="ar" onclick="switchLang('ar')">AR</button>
      </div>
    </nav>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>

    <!-- Scroll progress bar -->
    <div id="scroll-progress"></div>

    <!-- ═══ PAGE HERO ═════════════════════════════════════════════ -->
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div class="breadcrumb">
          <a href="/" data-i18n="nav.home">Home</a>
          <span>/</span>
          <strong data-i18n="page.hero.crumb">Products</strong>
        </div>
        <p class="page-hero-eyebrow" data-i18n="page.hero.eyebrow">The Full Collection</p>
        <h1 class="page-hero-title" data-i18n-html="page.hero.title">ALL <em>PRODUCTS</em></h1>
      </div>
    </section>

    <!-- ═══ MAIN CONTENT ══════════════════════════════════════════ -->
    <div class="container main-content">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="filter-toggle-btn" onclick="openFilterDrawer()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
            <span data-i18n="toolbar.filters">Filters</span>
            <span class="filter-count" id="mobileFilterCount">0</span>
          </button>
          <span class="result-count" id="resultCount"><strong>0</strong> <span data-i18n="toolbar.products">products</span></span>
        </div>
        <div class="toolbar-right">
          <select class="sort-select" id="sortSelect" onchange="handleSort()">
            <option value="default" data-i18n="sort.featured">Featured</option>
            <option value="price-asc" data-i18n="sort.priceAsc">Price: Low to High</option>
            <option value="price-desc" data-i18n="sort.priceDesc">Price: High to Low</option>
            <option value="newest" data-i18n="sort.newest">Newest First</option>
            <option value="name" data-i18n="sort.name">Name A–Z</option>
          </select>
        </div>
      </div>

      <!-- Active filter chips -->
      <div class="active-filters" id="activeFilters"></div>

      <!-- Products Layout -->
      <div class="products-layout">
        <aside class="sidebar" id="desktopSidebar">
          <div id="sidebarContent"></div>
        </aside>
        <div class="products-area">
          <div class="product-grid" id="productGrid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>

    <!-- Mobile Filter Drawer -->
    <div class="sidebar-overlay" id="filterOverlay" onclick="handleOverlayClick(event)">
      <div class="sidebar-drawer" id="filterDrawer">
        <div class="drawer-header">
          <h3 data-i18n="toolbar.filters">Filters</h3>
          <button class="drawer-close" onclick="closeFilterDrawer()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="drawerContent"></div>
      </div>
    </div>

    <div id="footerPlaceholder"></div>

    <!-- Toast -->
    <div id="toast" role="alert" aria-live="polite">
      <span class="toast-dot"></span>
      <span id="toastMsg">Added to cart!</span>
    </div>

    <!-- Scroll to Top -->
    <button id="scrollTop" aria-label="Scroll to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <a href="https://wa.me/213550066603" target="_blank" class="wa-btn" aria-label="WhatsApp">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
    </a>

    <!-- ══ ADD-TO-CART MODAL ══ -->
    <div class="atc-overlay" id="atcOverlay" onclick="if(event.target===this)closeAddToCartModal();">
      <div class="atc-modal">
        <button class="atc-close" onclick="closeAddToCartModal()">&#x2715;</button>
        <div class="atc-modal-img" id="atcImg"></div>
        <div class="atc-modal-name" id="atcName"></div>
        <div class="atc-modal-price" id="atcPrice"></div>
        <div class="atc-section" id="atcFlavorSection">
          <div class="atc-label" data-i18n="modal.shade">Color</div>
          <div class="atc-options" id="atcFlavorOptions"></div>
        </div>
        <div class="atc-section" id="atcWeightSection">
          <div class="atc-label" data-i18n="modal.size">Size</div>
          <div class="atc-options" id="atcWeightOptions"></div>
        </div>
        <div class="atc-section">
          <div class="atc-label">Quantity</div>
          <div class="atc-qty-row">
            <button class="atc-qty-btn" onclick="atcChangeQty(-1)">&#8722;</button>
            <span class="atc-qty-val" id="atcQtyVal">1</span>
            <button class="atc-qty-btn" onclick="atcChangeQty(1)">+</button>
          </div>
        </div>
        <button class="atc-confirm-btn" onclick="confirmAddToCart()">Add to Cart</button>
      </div>
    </div>

    <!-- ══ CART DRAWER ══ -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
      <div class="cart-drawer-hd">
        <span class="cart-drawer-title">Cart &nbsp;<span id="cartDrawerCount" style="font-size:14px;font-weight:500;color:var(--gray-400)">0 items</span></span>
        <button class="cart-drawer-x" onclick="toggleCart()">&#x2715;</button>
      </div>
      <div class="cart-drawer-body" id="cartDrawerBody"></div>
      <div class="cart-drawer-ft">
        <div class="cart-total">
          <span class="cart-total-lbl">Total</span>
          <span class="cart-total-num"><span id="cartDrawerTotal">0</span> DA</span>
        </div>
        <button class="cart-checkout" onclick="cartCheckout()">Checkout</button>
      </div>
    </div>

    <script src="/supplements/products/index.js?v=4" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supplements/supabase-client.js?v=7"></script>
    <script src="/supplements/footer.js"></script>
    <script src="/supplements/marquee.js"></script>
  </body>
</html>
